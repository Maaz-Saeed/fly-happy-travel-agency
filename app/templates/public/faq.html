{% extends "base.html" %}
{% block title %}FAQs{% endblock %}
{% block content %}
<div class="page-header-banner">
  <div class="container">
    <h1 data-aos="fade-up">Frequently Asked Questions</h1>
    <p class="breadcrumb-custom"><a href="{{ url_for('public.home') }}">Home</a> / <span class="current">FAQs</span></p>
  </div>
</div>
<section class="section-pad">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        {% for cat in categories %}
        <h5 class="text-brand mt-4 mb-3"><i class="fa-solid fa-folder-open me-2"></i>{{ cat }}</h5>
        <div class="accordion mb-4" id="accordion-{{ loop.index }}">
          {% for f in faqs if f.category == cat %}
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq-{{ f.id }}">
                {{ f.question }}
              </button>
            </h2>
            <div id="faq-{{ f.id }}" class="accordion-collapse collapse" data-bs-parent="#accordion-{{ loop.index }}">
              <div class="accordion-body text-muted">{{ f.answer }}</div>
            </div>
          </div>
          {% endfor %}
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
