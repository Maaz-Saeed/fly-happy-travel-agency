{% extends "base.html" %}
{% block title %}Our Team{% endblock %}
{% block content %}
<div class="page-header-banner">
  <div class="container">
    <h1 data-aos="fade-up">Meet Our Team</h1>
    <p class="breadcrumb-custom"><a href="{{ url_for('public.home') }}">Home</a> / <span class="current">Team</span></p>
  </div>
</div>
<section class="section-pad">
  <div class="container">
    <div class="row g-4">
      {% for m in members %}
      <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="{{ (loop.index0 % 6) * 40 }}">
        <div class="card-elevated text-center p-4 h-100">
          <img src="{{ url_for('static', filename='images/' ~ m.photo) }}" class="rounded-circle mx-auto mb-3" style="width:130px;height:130px;object-fit:cover;" alt="{{ m.name }}">
          <h6 class="fw-bold mb-0">{{ m.name }}</h6>
          <p class="text-brand small mb-2">{{ m.position }}</p>
          <p class="text-muted small">{{ m.bio }}</p>
          <a href="mailto:{{ m.email }}" class="btn btn-sm btn-outline-brand"><i class="fa-solid fa-envelope me-1"></i>Contact</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
