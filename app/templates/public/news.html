{% extends "base.html" %}
{% block title %}News{% endblock %}
{% block content %}
<div class="page-header-banner">
  <div class="container">
    <h1 data-aos="fade-up">Latest News</h1>
    <p class="breadcrumb-custom"><a href="{{ url_for('public.home') }}">Home</a> / <span class="current">News</span></p>
  </div>
</div>
<section class="section-pad">
  <div class="container">
    <div class="row g-4">
      {% for n in news_list %}
      <div class="col-lg-4" data-aos="fade-up" data-aos-delay="{{ (loop.index0 % 6) * 40 }}">
        <a href="{{ url_for('public.news_detail', slug=n.slug) }}" class="text-decoration-none text-dark">
          <div class="card card-elevated h-100">
            <img src="{{ url_for('static', filename='images/' ~ n.image) }}" class="card-img-top-fixed" alt="{{ n.title }}">
            <div class="card-body">
              <small class="text-muted">{{ n.published_at.strftime('%d %b %Y') }} &bull; {{ n.author }}</small>
              <h6 class="fw-bold mt-1">{{ n.title }}</h6>
              <p class="text-muted small">{{ n.summary }}</p>
              <span class="text-brand small fw-semibold">Read More <i class="fa-solid fa-arrow-right"></i></span>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
