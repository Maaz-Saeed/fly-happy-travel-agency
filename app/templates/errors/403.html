{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<section class="error-page d-flex align-items-center">
  <div class="container text-center py-5">
    <img src="{{ url_for('static', filename='images/logo.png') }}" class="mb-4" style="height:90px;" alt="logo">
    <h1 class="display-1 fw-bold text-brand">403</h1>
    <h3>Access Denied</h3>
    <p class="text-muted">You don't have permission to view this page.</p>
    <a href="{{ url_for('public.home') }}" class="btn btn-brand btn-lg mt-3"><i class="fa-solid fa-house me-2"></i>Back to Home</a>
  </div>
</section>
{% endblock %}
