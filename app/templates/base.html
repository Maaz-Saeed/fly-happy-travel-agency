<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ company_name }}{% endblock %} | {{ company_short_name }}</title>
<meta name="description" content="{{ company_name }} - Licensed Travel Agency ({{ company_license }}). Flights, Visas, Hajj &amp; Umrah, Holiday Packages and more.">

<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- AOS Animate On Scroll -->
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- Site theme -->
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
{% block extra_css %}{% endblock %}
</head>
<body>

<!-- ===================== LOADING SCREEN ===================== -->
<div id="loading-screen">
    <div class="loading-inner">
        <div class="loading-logo-wrap">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ company_name }}" class="loading-logo">
            <i class="fa-solid fa-plane loading-plane"></i>
        </div>
        <h4 class="loading-title">{{ company_short_name }}</h4>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
</div>

{% include "partials/navbar.html" %}

<main>
    {% include "partials/flash_messages.html" %}
    {% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}
{% include "partials/chatbot_widget.html" %}

<a href="#" id="back-to-top" class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></a>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
